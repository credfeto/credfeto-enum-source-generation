--- # Dispatch to deploy workflow for deployment.
# Maintain in repo: funfair-server-template
name: 'Dispatch to deploy workflow'
description: 'Dispatches deployment to a separate workflow'
inputs:
  cloud-formation-stack:
    description: 'The Cloud Formation stack to deploy as'
    required: true
  cloud-formation-template-file:
    description: 'The Cloud Formation file to deploy'
    required: true
  docker-app-owner:
    description: 'docker app owner'
    required: true
  docker-app-name:
    description: 'docker app name'
    required: true
  api-host:
    description: 'Api Host'
    required: false
  api-prefix:
    description: 'API Prefix'
    required: false
  aws-load-balancer-hostname:
    description: "AWS Load Balancer match hostname"
    required: false
  aws-load-balancer-priority:
    description: "AWS Load Balancer match priority"
    required: true
  docker-container-registry:
    description: "AWS container registry to retrieve package from"
    required: true
  build-version:
    description: "Build Version"
    required: true
  github-token:
    description: 'github token for accessing github'
    required: true

runs:
  using: "composite"
  steps:
    - name: "Log parameters"
      uses: ./.github/actions/log-deploy-parameters
      with:
        cloud-formation-stack: ${{inputs.cloud-formation-stack}}
        cloud-formation-template-file: ${{inputs.cloud-formation-template-file}}
        docker-app-owner: ${{inputs.docker-app-owner}}
        docker-app-name: ${{inputs.docker-app-name}}
        build-version: ${{inputs.build-version}}
        api-host: ${{inputs.api-host}}
        api-prefix: ${{inputs.api-prefix}}
        aws-load-balancer-hostname: ${{inputs.aws-load-balancer-hostname}}
        docker-container-registry: ${{inputs.docker-container-registry}}
        aws-load-balancer-priority: ${{inputs.aws-load-balancer-priority}}

    - name: "Create tag"
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        DOCKER_APP_NAME: ${{inputs.docker-app-name}}
        BUILD_VERSION: ${{inputs.build-version}}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const tag = `${process.env.DOCKER_APP_NAME}/v${process.env.BUILD_VERSION}`;
          try {
            await github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `refs/tags/${tag}`,
              sha: context.sha
            });
          } catch (e) {
            if (e.status !== 422) throw e;
            core.info(`* Tag ${tag} already exists - skipping`);
          }

    - name: "Trigger Deployment Workflow"
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        DOCKER_APP_NAME: ${{inputs.docker-app-name}}
        BUILD_VERSION: ${{inputs.build-version}}
        CLOUD_FORMATION_STACK: ${{inputs.cloud-formation-stack}}
        CLOUD_FORMATION_TEMPLATE_FILE: ${{inputs.cloud-formation-template-file}}
        DOCKER_APP_OWNER: ${{inputs.docker-app-owner}}
        API_HOST: ${{inputs.api-host}}
        API_PREFIX: ${{inputs.api-prefix}}
        AWS_LOAD_BALANCER_HOSTNAME: ${{inputs.aws-load-balancer-hostname}}
        DOCKER_CONTAINER_REGISTRY: ${{inputs.docker-container-registry}}
        AWS_LOAD_BALANCER_PRIORITY: ${{inputs.aws-load-balancer-priority}}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const id = await github.rest.actions.createWorkflowDispatch({
            owner: context.repo.owner,
            repo: context.repo.repo,
            workflow_id: 'deploy.yml',
            ref: `${process.env.DOCKER_APP_NAME}/v${process.env.BUILD_VERSION}`,
            inputs: {
                CLOUD_FORMATION_STACK: process.env.CLOUD_FORMATION_STACK,
                CLOUD_FORMATION_TEMPLATE_FILE: process.env.CLOUD_FORMATION_TEMPLATE_FILE,
                DOCKER_APP_OWNER: process.env.DOCKER_APP_OWNER,
                DOCKER_APP_NAME: process.env.DOCKER_APP_NAME,
                BUILD_VERSION: process.env.BUILD_VERSION,
                API_HOST: process.env.API_HOST,
                API_PREFIX: process.env.API_PREFIX,
                AWS_LOAD_BALANCER_HOSTNAME: process.env.AWS_LOAD_BALANCER_HOSTNAME,
                DOCKER_CONTAINER_REGISTRY: process.env.DOCKER_CONTAINER_REGISTRY,
                AWS_LOAD_BALANCER_PRIORITY: process.env.AWS_LOAD_BALANCER_PRIORITY,
              }
          });

          console.log(`Result: ${JSON.stringify(id)}`);
