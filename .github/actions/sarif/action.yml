--- # Build and deploy packages
# Maintain in repo: funfair-server-template
name: 'Upload sarif files'
description: 'Builds and deploys the source'
inputs:
  # GENERAL
  repo-visibility:
    description: 'Visibility of the repo'
    required: true

runs:
  using: "composite"
  steps:
    - name: "Sarif Files to upload"
      shell: bash
      working-directory: ${{github.workspace}}/results
      run: |
        ls -la
        rm -rf *.Tests.sarif
        echo "Hash: ${{ hashfiles('**/*.sarif') }}"
        echo "SARIF_HASH=${{ hashfiles('**/*.sarif') }}" >> $GITHUB_ENV

    - if: inputs.repo-visibility == 'public' && env.SARIF_HASH != ''
      name: "Upload SARIF file for diagnostics"
      id: sarif
      uses: github/codeql-action/upload-sarif@f3712979fa5f215279b101dd0a2e3bdfb4353324 # v3.37.7
      continue-on-error: true
      with:
        sarif_file: ${{github.workspace}}/results
        token: ${{github.token}}
        # Upload is fire-and-forget: nothing later in the job consumes processing results,
        # and continue-on-error above already absorbs any processing failure.
        wait-for-processing: false

    - if: inputs.repo-visibility == 'public' && env.SARIF_HASH != ''
      name: "Sarif Upload Summary"
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      continue-on-error: true
      env:
        SARIF_ID: ${{steps.sarif.outputs.sarif-id}}
      with:
        script: |
          core.info('Sarif Upload Completed');
          core.notice(`sarifId: ${process.env.SARIF_ID}`);
