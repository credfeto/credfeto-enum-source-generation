--- # Build and deploy packages
# Maintain in repo: funfair-server-template
name: "Upload sarif files"
description: "Uploads SARIF files (excluding test results) to GitHub code scanning"
inputs:
  # GENERAL
  repo-visibility:
    description: "Visibility of the repo"
    required: true
  repo-fork:
    description: "Whether the repo is a fork ('true' or 'false'); upload failures are tolerated on forks"
    required: true

runs:
  using: "composite"
  steps:
    - name: "Sarif Files to upload"
      shell: bash
      working-directory: "${{github.workspace}}/results"
      run: |
        ls -la
        rm -f ./*.Tests.sarif
        if [ -n "$(find . -maxdepth 1 -name '*.sarif' -print -quit)" ]; then
          echo "SARIF_HASH=present" >> "$GITHUB_ENV"
        else
          echo "No sarif files to upload"
          echo "SARIF_HASH=" >> "$GITHUB_ENV"
        fi

    - name: "Upload SARIF file for diagnostics"
      id: sarif
      if: inputs.repo-visibility == 'public' && env.SARIF_HASH != ''
      uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
      continue-on-error: "${{inputs.repo-fork == 'true'}}"
      with:
        sarif_file: "${{github.workspace}}/results"
        token: "${{github.token}}"
        # Upload is fire-and-forget: nothing later in the job consumes processing results.
        # continue-on-error above only tolerates failures on forks (read-only token).
        wait-for-processing: false

    - name: "Sarif Upload Summary"
      if: inputs.repo-visibility == 'public' && env.SARIF_HASH != ''
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      continue-on-error: "${{inputs.repo-fork == 'true'}}"
      env:
        SARIF_ID: "${{steps.sarif.outputs.sarif-id}}"
      with:
        script: |
          core.info('Sarif Upload Completed');
          core.notice(`sarifId: ${process.env.SARIF_ID}`);
