--- # Push packages in dist to a NuGet feed
# Maintain in repo: funfair-server-template
name: "Publish to nuget"
description: "Publishes Nuget packages"
inputs:
  nuget-feed:
    description: "Nuget feed to push packages to"
    required: true
  nuget-api-key:
    description: "API key to authenticate when pushing packages"
    required: true

runs:
  using: "composite"
  steps:

    - name: "Check Required Secrets: nuget-api-key"
      uses: ./.github/actions/check-required-secret
      with:
        secret-name: "nuget-api-key"
        secret-value: "${{inputs.nuget-api-key}}"

    - name: "Check Packages Exist"
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      with:
        script: |
          const dist = `${process.env.GITHUB_WORKSPACE}/dist`;
          const globber = await glob.create(`${dist}/*.nupkg`);
          const packages = await globber.glob();
          if (packages.length === 0) {
            core.setFailed(`❌ No .nupkg files found in ${dist}`);
          } else {
            core.info(`✅ Found ${packages.length} .nupkg file(s) to push`);
          }

    - name: "NuGet Push"
      working-directory: "${{github.workspace}}"
      shell: bash
      run: |
        timeout 10m dotnet nuget push "dist/*.nupkg" --source "$NUGET_FEED" --api-key "$NUGET_API_KEY" --skip-duplicate
      env:
        NUGET_FEED: "${{inputs.nuget-feed}}"
        NUGET_API_KEY: "${{inputs.nuget-api-key}}"
