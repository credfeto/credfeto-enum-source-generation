--- # Build and deploy packages
# Maintain in repo: funfair-server-template
name: 'Build Dotnet'
description: 'Builds and deploys the source'
inputs:
  # General
  production-build:
    description: 'Whether to build a production build'
    required: true

  # NUGET
  nuget-pack:
    description: 'Whether to pack packages with feeds'
    required: false
  nuget-feed:
    description: 'Nuget feed to push packages to'
    required: false
  nuget-feed-type:
    description: >-
      Which feed to publish packages to: 'NUGET' publishes to nuget-feed via Trusted Publishing
      (nuget.org is deprecating static API keys, so no key is used), 'SLEET' publishes via Sleet,
      empty/unset skips publishing
    required: false
  nuget-username:
    description: 'nuget.org username (profile name) the Trusted Publishing policy is registered against'
    required: false
  sleet-config:
    description: 'Sleet config file'
    required: false
  sleet-feed:
    description: 'Sleet feed to push packages to'
    required: false
  dotnet-docker-platform:
    description: 'Dotnet docker platform (e.g. linux-arm64)'
    required: false

  # General
  build-version:
    description: 'Build version'
    required: true

  release:
    description: 'Is this a release build'
    required: true

  pre-release-build:
    description: 'Whether pre-release NuGet packages are allowed'
    required: true

  release-notes:
    description: 'Release notes'
    required: false

  build-sql:
    description: 'Whether to build SQL DB'
    required: true
  db-folder:
    description: 'Folder where SQL Files live'
    required: false

  # GENERAL
  github-token:
    description: 'Github Token'
    required: true

  # DEPLOYMENT
  project-to-publish:
    description: 'Package (root) to deploy'
    required: false

runs:
  using: "composite"
  steps:

    ############################################################################################################
    # DOTNET BUILD
    ############################################################################################################

    - name: "Dotnet: Run build check"
      if: (!endsWith(github.repository, 'funfair-dotnet-build-check')) && (!endsWith(github.repository, '-template'))
      uses: ./.github/actions/dotnet-build-check
      with:
        pre-release-build: ${{inputs.pre-release-build}}

    - name: "Dotnet: Override code analysis rules"
      if: "!endsWith(github.repository, '-template')"
      uses: ./.github/actions/dotnet-code-analysis-override
      with:
        release: ${{inputs.release}}

    - name: "Dotnet: Restore packages"
      working-directory: ${{github.workspace}}/src
      shell: bash
      run: |
        dotnet restore \
              --warnaserror \
              -nodeReuse:False \
              -p:NoWarn=MSB4241 \
              -p:SuppressNETCoreSdkPreviewMessage=true || \
        dotnet restore \
              --warnaserror \
              -nodeReuse:False \
              -p:NoWarn=MSB4241 \
              -p:SuppressNETCoreSdkPreviewMessage=true \
              --ignore-failed-sources || \
        dotnet restore \
              --warnaserror \
              -nodeReuse:False \
              -p:NoWarn=MSB4241 \
              -p:SuppressNETCoreSdkPreviewMessage=true \
              --ignore-failed-sources

    - name: "Dotnet: Build"
      working-directory: ${{github.workspace}}/src
      shell: bash
      run: |
        dotnet build \
                  --warnaserror \
                  --no-restore \
                  --configuration Release \
                  "-p:ContinuousIntegrationBuild=true" \
                  "-p:EnableSarif=True" \
                  "-p:IsProduction=${{inputs.production-build}}" \
                  "-p:NoWarn=MSB4241" \
                  "-p:SuppressNETCoreSdkPreviewMessage=true" \
                  "-p:Version=${{inputs.build-version}}" \
                  -nodeReuse:False
      env:
        ReleaseNotes: ${{inputs.release-notes}}

    ## RUN TESTS
    - name: "Dotnet: Test"
      working-directory: ${{github.workspace}}/src
      shell: bash
      run: |
        dotnet test \
                  --configuration Release \
                  --long-running 10 \
                  --filter-not-namespace "*.Benchmark.Tests" \
                  --filter-not-namespace "*.Benchmark.Tests.*" \
                  --filter-not-namespace "*.Integration.Tests" \
                  --filter-not-namespace "*.Integration.Tests.*" \
                  --parallel-algorithm aggressive \
                  --ignore-exit-code 8 \
                  --report-github \
                  "-p:ContinuousIntegrationBuild=true" \
                  "-p:IsProduction=${{inputs.production-build}}" \
                  "-p:NoWarn=MSB4241" \
                  "-p:Optimize=true" \
                  "-p:SuppressNETCoreSdkPreviewMessage=true" \
                  "-p:Version=${{inputs.build-version}}"
      env:
        ReleaseNotes: ${{inputs.release-notes}}

    # ############################################################################################################
    # # DATABASE BUILD
    # ############################################################################################################
    - name: "SQL: Build"
      if: inputs.build-sql == 'true'
      uses: ./.github/actions/sql
      with:
        db-folder: ${{inputs.db-folder}}
        github-token: ${{inputs.github-token}}

    ############################################################################################################
    # Publish ready for deploy
    ############################################################################################################

    - name: "Dotnet: Publish Packages"
      if: inputs.project-to-publish != ''
      uses: ./.github/actions/dotnet-publish
      with:
        production-build: ${{inputs.production-build}}
        build-version: ${{inputs.build-version}}
        release-notes: ${{inputs.release-notes}}
        platform: ${{inputs.dotnet-docker-platform}}
        project-to-publish: ${{inputs.project-to-publish}}

    ############################################################################################################
    # DOTNET PUSH TO NUGET
    ############################################################################################################
    - name: "Dotnet: Pack and publish nuget packages"
      if: inputs.nuget-pack == 'true'
      uses: ./.github/actions/nuget-publish
      with:
        build-version: ${{inputs.build-version}}
        production-build: ${{inputs.production-build}}
        release-notes: ${{inputs.release-notes}}
        nuget-feed: ${{inputs.nuget-feed}}
        nuget-feed-type: ${{inputs.nuget-feed-type}}
        nuget-username: ${{inputs.nuget-username}}
        sleet-config: ${{inputs.sleet-config}}
        sleet-feed: ${{inputs.sleet-feed}}
