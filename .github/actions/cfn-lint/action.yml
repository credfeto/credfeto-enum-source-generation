--- # Action: Run Cloud Formation Linter
# Maintain in repo: funfair-server-template
name: "Run Cloud Formation Linter"
description: "Installs cfn-lint via pip and lints a CloudFormation template"

inputs:
  template:
    description: "Path to the CloudFormation template file to lint"
    required: true

runs:
  using: composite
  steps:
    - name: "Setup Python"
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.13"

    - name: "Set cfn-lint venv path"
      shell: bash
      run: |
        VENV_BASE="$RUNNER_TEMP/cfn-lint"
        VENV_RUN="$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_NUMBER-$GITHUB_RUN_ATTEMPT"
        {
          echo "CFN_LINT_VENV_BASE=$VENV_BASE"
          echo "CFN_LINT_VENV=$VENV_BASE/$VENV_RUN"
        } >> "$GITHUB_ENV"

    - name: "Create cfn-lint virtual environment"
      shell: bash
      run: |
        mkdir -p "$(dirname "$CFN_LINT_VENV")"
        python -m venv "$CFN_LINT_VENV"
        echo "cfn-lint==1.59.0" >"$CFN_LINT_VENV/requirements.txt"
        "$CFN_LINT_VENV/bin/pip" install --quiet -r "$CFN_LINT_VENV/requirements.txt"

    - name: "Run Cloud Formation Linter"
      shell: bash
      run: |
        "$CFN_LINT_VENV/bin/cfn-lint" --info --include-checks I --template "$TEMPLATE"
      env:
        TEMPLATE: "${{inputs.template}}"

    - name: "Cleanup cfn-lint virtual environment"
      if: always()
      shell: bash
      run: |
        [[ -n "$CFN_LINT_VENV" ]] && rm -rf "$CFN_LINT_VENV" || true
        [[ -n "$CFN_LINT_VENV_BASE" ]] && rmdir "$CFN_LINT_VENV_BASE" 2>/dev/null || true
