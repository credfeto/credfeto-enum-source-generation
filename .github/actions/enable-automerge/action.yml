--- # Enable auto-merge on a pull request (defaults to the current pull request)
# Maintain in repo: funfair-server-template
name: "Enable Auto-Merge"
description: "Enables auto-merge on the pull request identified by pr-number, or the current pull request when pr-number is not supplied"

inputs:
  github-token:
    description: "GitHub token with pull-requests write permission"
    required: true
  merge-method:
    description: "Merge method to use: MERGE, SQUASH, or REBASE"
    required: false
    default: "MERGE"
  pr-number:
    description: "Pull request number to enable auto-merge on; defaults to the pull request that triggered the workflow"
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: "Enable Auto-Merge"
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      with:
        github-token: "${{inputs.github-token}}"
        script: |
          const mergeMethod = process.env.MERGE_METHOD;
          const prNumber = Number(process.env.PR_NUMBER || context.payload.pull_request?.number);
          if (!Number.isInteger(prNumber) || prNumber <= 0) {
            core.setFailed('No pull request number available: supply the pr-number input or run on a pull_request event.');
            return;
          }
          const pullRequest = process.env.PR_NUMBER
            ? (await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
              })).data
            : context.payload.pull_request;
          await github.graphql(`
            mutation EnableAutoMerge($pullRequestId: ID!, $mergeMethod: PullRequestMergeMethod!) {
              enablePullRequestAutoMerge(input: {
                pullRequestId: $pullRequestId,
                mergeMethod: $mergeMethod
              }) {
                pullRequest {
                  autoMergeRequest {
                    mergeMethod
                  }
                }
              }
            }
          `, {
            pullRequestId: pullRequest.node_id,
            mergeMethod: mergeMethod,
          });
          core.info(`✅ Enabled auto-merge (${mergeMethod}) on PR #${prNumber}`);
          core.notice(`Enabled auto-merge (${mergeMethod}) on PR #${prNumber}`);
      env:
        MERGE_METHOD: "${{inputs.merge-method}}"
        PR_NUMBER: "${{inputs.pr-number}}"
