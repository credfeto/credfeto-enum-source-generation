--- # Save a secret to file
# Maintain in repo: funfair-server-template
name: "Save Secret To File"
description: "Saves a secret to a file"
inputs:
  secret:
    description: "Secret value to write"
    required: true
outputs:
  file:
    description: "The file the secret was written to"
    value: "${{steps.generate-filename.outputs.file}}"

runs:
  using: "composite"
  steps:
    - name: "Generate temporary filename"
      id: generate-filename
      shell: bash
      run: |
        echo "file=$RUNNER_TEMP/$(openssl rand -base64 40 | tr '/+' '_-' | tr -d '=').tmp" >> "${GITHUB_OUTPUT}"
      env:
        RUNNER_TEMP: "${{runner.temp}}"

    - name: "Write secret to file"
      id: write-file
      shell: bash
      run: |
        printf '%s' "$VALUE" > "${FILE}"
      env:
        FILE: "${{steps.generate-filename.outputs.file}}"
        VALUE: "${{inputs.secret}}"
