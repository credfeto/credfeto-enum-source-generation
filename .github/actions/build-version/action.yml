--- # Define build version properties
# Maintain in repo: funfair-server-template
name: "Define Build Version"
description: "Defines the build version properties"
inputs:
  # GENERAL
  github-token:
    description: "Github Token"
    required: true

runs:
  using: "composite"
  steps:
    - name: "Define Build Version"
      uses: ./.github/actions/dotnet-tool-run
      with:
        working-directory: "${{github.workspace}}"
        tool-name: "buildversion"
        tool-arguments: |
          --GithubToken
          ${{inputs.github-token}}
          --TagPrefix
          github

    - name: "Log build version"
      shell: bash
      run: |
        if [ -z "${BUILD_VERSION:-}" ]; then
          echo "::error::BUILD_VERSION was not set by the buildversion tool"
          exit 1
        fi
        case "$BUILD_VERSION" in
          *$'\n'*|*$'\r'*) echo "::error::BUILD_VERSION must not contain newlines"; exit 1;;
        esac
        echo "****************************************************************"
        printf '* Current Build: \033[38;5;6m%s\033[0m\n' "$BUILD_VERSION"
        echo "****************************************************************"
