--- # Sync labels on a pull request based on the labeler configuration
# Maintain in repo: funfair-server-template
name: "Sync PR Labels"
description: "Syncs labels on a pull request based on the labeler configuration"

inputs:
  github-token:
    description: "GitHub token"
    required: true
  pr-number:
    description: "Pull request number to label"
    required: true

runs:
  using: composite
  steps:
    - name: "Sync Labels"
      uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
      with:
        repo-token: ${{inputs.github-token}}
        configuration-path: .github/labeler.yml
        sync-labels: false
        pr-number: ${{inputs.pr-number}}
