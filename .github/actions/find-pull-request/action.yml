--- # Find an open pull request for a given branch
# Maintain in repo: funfair-server-template
name: "Find Pull Request"
description: "Finds an open pull request for a given branch and returns its number and head SHA"

inputs:
  branch:
    description: "Branch name to search for"
    required: true
  github-token:
    description: "GitHub token to use for the API call"
    required: false

outputs:
  number:
    description: "Pull request number, or empty string if not found"
    value: ${{steps.find-pr.outputs.number}}
  head-sha:
    description: "Head commit SHA of the pull request, or empty string if not found"
    value: ${{steps.find-pr.outputs.head-sha}}
  pre-release-build:
    description: "Whether the pull request is a draft targeting main, or 'false' if not"
    value: ${{steps.find-pr.outputs.pre-release-build}}

runs:
  using: composite
  steps:
    - name: "Find Pull Request"
      id: find-pr
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        BRANCH: ${{inputs.branch}}
      with:
        github-token: ${{inputs.github-token || github.token}}
        script: |
          const branch = process.env.BRANCH;
          const { data: pulls } = await github.rest.pulls.list({
            owner: context.repo.owner,
            repo: context.repo.repo,
            state: 'open',
            head: `${context.repo.owner}:${branch}`,
          });
          if (pulls.length > 0) {
            const pr = pulls[0];
            core.setOutput('number', String(pr.number));
            core.setOutput('head-sha', pr.head.sha);
            core.setOutput('pre-release-build', String(pr.draft === true && pr.base.ref === 'main'));
          } else {
            core.setOutput('number', '');
            core.setOutput('head-sha', '');
            core.setOutput('pre-release-build', 'false');
          }
