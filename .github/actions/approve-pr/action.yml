--- # Approve a pull request (defaults to the current pull request)
# Maintain in repo: funfair-server-template
name: "Approve PR"
description: "Approves the pull request identified by pr-number, or the current pull request when pr-number is not supplied"

inputs:
  github-token:
    description: "GitHub token with pull-requests write permission"
    required: true
  pr-number:
    description: "Pull request number to approve; defaults to the pull request that triggered the workflow"
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: "Approve PR"
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      with:
        github-token: "${{inputs.github-token}}"
        script: |
          const prNumber = Number(process.env.PR_NUMBER || context.payload.pull_request?.number);
          if (!Number.isInteger(prNumber) || prNumber <= 0) {
            core.setFailed('❌ No pull request number available: supply the pr-number input or run on a pull_request event.');
            return;
          }
          await github.rest.pulls.createReview({
            owner: context.repo.owner,
            repo: context.repo.repo,
            pull_number: prNumber,
            event: 'APPROVE',
          });
          core.info(`✅ Approved PR #${prNumber}`);
          core.notice(`Approved PR #${prNumber}`);
      env:
        PR_NUMBER: "${{inputs.pr-number}}"
