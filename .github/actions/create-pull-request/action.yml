--- # Create a pull request and assign labels and assignees
# Maintain in repo: funfair-server-template
name: "Create Pull Request"
description: "Creates a pull request and assigns labels and assignees"

inputs:
  github-token:
    description: "GitHub token with pull-requests write permission"
    required: true
  source-branch:
    description: "Branch to merge from (default: triggering branch)"
    required: false
    default: ""
  destination-branch:
    description: "Branch to merge into"
    required: false
    default: "main"
  assignee:
    description: "Comma-separated list of assignees"
    required: false
    default: ""
  labels:
    description: "Comma-separated list of labels"
    required: false
    default: ""
  draft:
    description: "Create as draft PR"
    required: false
    default: "false"
  title:
    description: "Pull request title"
    required: true
  body:
    description: "Pull request body"
    required: false
    default: ""

outputs:
  pr_number:
    description: "Number of the created pull request"
    value: ${{steps.create.outputs.pr_number}}
  pr_url:
    description: "URL of the created pull request"
    value: ${{steps.create.outputs.pr_url}}
  has_changed_files:
    description: "Whether the pull request has changed files"
    value: ${{steps.create.outputs.has_changed_files}}

runs:
  using: composite
  steps:
    - name: "Create Pull Request"
      id: create
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      with:
        github-token: ${{inputs.github-token}}
        script: |
          const sourceBranch = process.env.SOURCE_BRANCH || context.ref.replace('refs/heads/', '');
          const destinationBranch = process.env.DESTINATION_BRANCH;
          const title = process.env.TITLE;
          const body = process.env.BODY;
          const draft = process.env.DRAFT === 'true';
          const assignees = process.env.ASSIGNEE
            ? process.env.ASSIGNEE.split(',').map(a => a.trim()).filter(Boolean)
            : [];
          const labels = process.env.LABELS
            ? process.env.LABELS.split(',').map(l => l.trim()).filter(Boolean)
            : [];
          const ownerRepo = { owner: context.repo.owner, repo: context.repo.repo };

          async function createPr(asDraft) {
            const { data } = await github.rest.pulls.create({
              ...ownerRepo,
              title: title,
              body: body,
              head: sourceBranch,
              base: destinationBranch,
              draft: asDraft,
            });
            return data;
          }

          let pr;
          try {
            pr = await createPr(draft);
          } catch (err) {
            if (err.status !== 422) {
              throw err;
            }

            const isPrAlreadyExists =
              Array.isArray(err.response?.data?.errors) &&
              err.response.data.errors.some(
                e => e.resource === 'PullRequest' && typeof e.message === 'string' && e.message.startsWith('A pull request already exists')
              );

            if (isPrAlreadyExists) {
              core.info(`PR already exists for branch ${sourceBranch} - looking up the existing pull request`);
              const { data: existingPrs } = await github.rest.pulls.list({
                ...ownerRepo,
                head: `${context.repo.owner}:${sourceBranch}`,
                base: destinationBranch,
                state: 'open',
                per_page: 1,
              });
              if (existingPrs.length === 0) {
                throw new Error(
                  `Pull request creation reported "already exists" for ${sourceBranch} -> ${destinationBranch}, but no matching open pull request was found`
                );
              }
              // pulls.list omits fields such as changed_files that pulls.create returns;
              // fetch the full representation so both paths converge on the same shape.
              const { data: existingPr } = await github.rest.pulls.get({
                ...ownerRepo,
                pull_number: existingPrs[0].number,
              });
              pr = existingPr;
            } else if (
              draft &&
              typeof err.response?.data?.message === 'string' &&
              err.response.data.message.includes('Draft pull requests are not supported')
            ) {
              core.warning('Draft pull requests are not supported in this repository - creating a regular pull request instead');
              pr = await createPr(false);
            } else {
              throw err;
            }
          }

          const followUps = [];
          if (assignees.length > 0) {
            followUps.push(
              github.rest.issues.addAssignees({
                ...ownerRepo,
                issue_number: pr.number,
                assignees: assignees,
              })
            );
          }

          if (labels.length > 0) {
            followUps.push(
              github.rest.issues.addLabels({
                ...ownerRepo,
                issue_number: pr.number,
                labels: labels,
              })
            );
          }

          await Promise.all(followUps);

          core.info(`Pull request #${pr.number}: ${pr.html_url}`);
          core.setOutput('pr_number', String(pr.number));
          core.setOutput('pr_url', pr.html_url);
          core.setOutput('has_changed_files', String(pr.changed_files > 0));
      env:
        SOURCE_BRANCH: ${{inputs.source-branch}}
        DESTINATION_BRANCH: ${{inputs.destination-branch}}
        TITLE: ${{inputs.title}}
        BODY: ${{inputs.body}}
        DRAFT: ${{inputs.draft}}
        ASSIGNEE: ${{inputs.assignee}}
        LABELS: ${{inputs.labels}}
