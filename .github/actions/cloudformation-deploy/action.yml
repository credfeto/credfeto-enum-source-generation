--- # Deploy docker image using cloudformation template to aws
# Maintain in repo: funfair-server-template
name: 'Deploy to Cloudformation template'
description: 'Deploy docker image using cloudformation template to aws'
inputs:
  cloud-formation-stack:
    description: 'The Cloud Formation stack to deploy as'
    required: true
  cloudformation-sns-arn:
    description: 'SSN Notification ARN'
    required: false
  cloud-formation-template-file:
    description: 'The Cloud Formation file to deploy'
    required: true
  docker-app-name:
    description: 'docker app name'
    required: true
  api-host:
    description: 'Api Host'
    required: true
  aws-load-balancer-hostname:
    description: "AWS Load Balancer match hostname"
    required: true
  aws-load-balancer-priority:
    description: "AWS Load Balancer match priority"
    required: true
  docker-container-registry:
    description: "AWS container registry to retrieve package from"
    required: true
  build-version:
    description: "Build Version"
    required: true

runs:
  using: "composite"
  steps:

    - name: "Add offsets for direct connections"
      id: priorities
      shell: bash
      env:
        AWS_LOAD_BALANCER_PRIORITY: ${{inputs.aws-load-balancer-priority}}
      run: |
        if ! [[ "$AWS_LOAD_BALANCER_PRIORITY" =~ ^[0-9]+$ ]]; then
          echo "::error::AWS_LOAD_BALANCER_PRIORITY must be a non-negative integer, got: $AWS_LOAD_BALANCER_PRIORITY"
          exit 1
        fi
        if [ "$AWS_LOAD_BALANCER_PRIORITY" -gt 0 ]; then
          {
            MAIN=$((AWS_LOAD_BALANCER_PRIORITY))
            DIRECT1=$((MAIN+1))
            DIRECT2=$((MAIN+2))
            echo "MAIN=$MAIN"
            echo "DIRECT1=$DIRECT1"
            echo "DIRECT2=$DIRECT2"
          } >> "$GITHUB_OUTPUT"
        else
          {
            echo "MAIN=-1"
            echo "DIRECT1=-1"
            echo "DIRECT2=-1"
          } >> "$GITHUB_OUTPUT"
        fi

    - name: "Build TemplateParameters file"
      shell: bash
      run: |
        FIRST=1
        {
          echo "["
          jq '.Parameters' "$CLOUD_FORMATION_TEMPLATE_FILE" | \
                    grep ': {' | \
                    grep -oEi '([a-z]|_|[1-9])+' | \
                    sort | \
                    uniq | while read -r key; do

            value="${!key}"

            # only output the keys which have values
            if [ -n "$value" ]; then

              [ "$FIRST" -eq 0 ] && echo "  ,"
              FIRST=0

              # TODO: need a better way to do this that allows for escaping of
              #       characters that need to in json.
              echo "  {\"ParameterKey\":\"$key\",\"ParameterValue\":\"$value\"}"

            fi

            done
            echo "]"
          } > "${{github.workspace}}/TemplateParameters.json"
      env:
        CLOUD_FORMATION_TEMPLATE_FILE: ${{inputs.cloud-formation-template-file}}
        ApplicationName: ${{inputs.cloud-formation-stack}}
        ApplicationContainer: ${{inputs.docker-app-name}}
        ApplicationVersion: ${{inputs.build-version}}
        ApiPrefix: /${{inputs.docker-app-name}}
        ApiHost: ${{inputs.api-host}}
        LoadBalancerHostName: ${{inputs.aws-load-balancer-hostname}}
        LoadBalancerPriority: ${{steps.priorities.outputs.MAIN}}
        Direct1LoadBalancerPriority: ${{steps.priorities.outputs.DIRECT1}}
        Direct2LoadBalancerPriority: ${{steps.priorities.outputs.DIRECT2}}
        AwsContainerRegistry: ${{inputs.docker-container-registry}}

    - name: "show Validated TemplateParameters"
      shell: bash
      env:
        CLOUDFORMATION_SNS_ARN: ${{inputs.cloudformation-sns-arn}}
      run: |
        echo "SNS ARN: $CLOUDFORMATION_SNS_ARN"
        echo "Validated parameters:"
        jq . "${{github.workspace}}/TemplateParameters.json"

    - name: "AWS Cloudformation Deploy"
      shell: bash
      env:
        CLOUD_FORMATION_TEMPLATE_FILE: ${{inputs.cloud-formation-template-file}}
        CLOUD_FORMATION_STACK: ${{inputs.cloud-formation-stack}}
        CLOUDFORMATION_SNS_ARN: ${{inputs.cloudformation-sns-arn}}
        BUILD_VERSION: ${{inputs.build-version}}
      run: |
        NOTIFICATION_ARGS=()
        [ -n "$CLOUDFORMATION_SNS_ARN" ] && NOTIFICATION_ARGS=(--notification-arns "$CLOUDFORMATION_SNS_ARN")
        /usr/local/aws-cli/v2/current/bin/aws \
                  cloudformation deploy \
                        --template-file \
                              "$CLOUD_FORMATION_TEMPLATE_FILE" \
                        --stack-name \
                              "$CLOUD_FORMATION_STACK" \
                        --parameter-overrides \
                              file://TemplateParameters.json \
                        "${NOTIFICATION_ARGS[@]}" \
                        --tags \
                              "App=$CLOUD_FORMATION_STACK" \
                              "Version=$BUILD_VERSION"

    - name: "AWS Enable Stack termination protection"
      shell: bash
      env:
        CLOUD_FORMATION_STACK: ${{inputs.cloud-formation-stack}}
      run: |
        /usr/local/aws-cli/v2/current/bin/aws \
                  cloudformation update-termination-protection \
                          --enable-termination-protection \
                          --stack-name "$CLOUD_FORMATION_STACK"
