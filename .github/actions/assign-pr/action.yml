--- # Assign a pull request to one or more users
# Maintain in repo: funfair-server-template
name: "Assign PR"
description: "Assigns a pull request to the given users, warning about any assignee GitHub silently drops"

inputs:
  github-token:
    description: "GitHub token with pull-requests write permission"
    required: true
  pr-number:
    description: "Number of the pull request to assign"
    required: true
  assignees:
    description: "Logins to assign, separated by commas or newlines"
    required: true

runs:
  using: composite
  steps:
    - name: "Assign PR"
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        PR_NUMBER: "${{inputs.pr-number}}"
        ASSIGNEES: "${{inputs.assignees}}"
      with:
        github-token: "${{inputs.github-token}}"
        script: |
          const prNumber = Number(process.env.PR_NUMBER);
          if (!Number.isInteger(prNumber) || prNumber <= 0) {
            core.setFailed(`❌ pr-number must be a positive integer, got '${process.env.PR_NUMBER}'`);
            return;
          }
          const assignees = (process.env.ASSIGNEES ?? '').split(/[,\n]/).map(a => a.trim()).filter(Boolean);
          if (assignees.length === 0) {
            core.setFailed('❌ assignees must name at least one login');
            return;
          }
          const { data: updated } = await github.rest.issues.addAssignees({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: prNumber,
            assignees: assignees,
          });
          // GitHub returns success but silently drops assignees it cannot assign (e.g. bots, or a fork PR author who is not a collaborator)
          const assignedLogins = new Set((updated.assignees ?? []).map(a => a.login.toLowerCase()));
          const assigned = assignees.filter(a => assignedLogins.has(a.toLowerCase()));
          const dropped = assignees.filter(a => !assignedLogins.has(a.toLowerCase()));
          if (dropped.length > 0) {
            core.warning(`⚠️ PR #${prNumber} was not assigned to ${dropped.join(', ')}: GitHub dropped the assignee(s), ` +
              'most likely because they cannot be assigned in this repository');
          }
          if (assigned.length > 0) {
            core.info(`✅ Assigned PR #${prNumber} to ${assigned.join(', ')}`);
            core.notice(`Assigned PR #${prNumber} to ${assigned.join(', ')}`);
          }
