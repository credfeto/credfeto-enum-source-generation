--- # Build and deploy packages
# Maintain in repo: funfair-server-template
name: "Pack and publish nuget packages"
description: "Packs nuget packages and publishes them to the configured feed"
inputs:
  build-version:
    description: "Build version"
    required: true
  production-build:
    description: "Whether to build a production build"
    required: true
  release-notes:
    description: "Release notes"
    required: false
  nuget-feed:
    description: "Nuget feed to push packages to"
    required: false
  nuget-feed-type:
    description: >-
      Which feed to publish packages to: 'NUGET' publishes to nuget-feed via Trusted Publishing
      (nuget.org is deprecating static API keys, so no key is used), 'SLEET' publishes via Sleet,
      empty/unset skips publishing
    required: false
  nuget-username:
    description: "nuget.org username (profile name) the Trusted Publishing policy is registered against"
    required: false
  sleet-config:
    description: "Sleet config file"
    required: false
  sleet-feed:
    description: "Sleet feed to push packages to"
    required: false

runs:
  using: "composite"
  steps:

    - name: "Check nuget-feed-type is valid"
      shell: bash
      run: |
        case "${NUGET_FEED_TYPE}" in
          ''|'NUGET'|'SLEET') ;;
          *)
            echo "::error::nuget-feed-type must be 'NUGET', 'SLEET', or empty/unset"
            exit 1
            ;;
        esac
      env:
        NUGET_FEED_TYPE: "${{inputs.nuget-feed-type}}"

    - name: "Dotnet: Pack tool"
      working-directory: "${{github.workspace}}/src"
      shell: bash
      run: |
        dotnet pack \
                  --warnaserror \
                  --configuration Release \
                  "-p:Version=$BUILD_VERSION" \
                  "-p:IsProduction=$PRODUCTION_BUILD" \
                  "-p:IncludeSymbols=False" \
                  --no-restore \
                  -nodeReuse:False \
                  "-p:NoWarn=MSB4241" \
                  "-p:ContinuousIntegrationBuild=true"
      env:
        ReleaseNotes: "${{inputs.release-notes}}"
        PRODUCTION_BUILD: "${{inputs.production-build}}"
        BUILD_VERSION: "${{inputs.build-version}}"

    - name: "Dotnet: Copy packed to dist"
      shell: bash
      run: |
        shopt -s globstar nullglob
        packages=(**/*.nupkg)
        if [ "${#packages[@]}" -eq 0 ]; then
          echo "::error::No .nupkg files found to copy to dist"
          exit 1
        fi
        cp "${packages[@]}" "$GITHUB_WORKSPACE/dist"
      working-directory: "${{github.workspace}}/src"

    - name: "Dotnet: Publish Packages to Nuget (Trusted Publishing)"
      if: inputs.nuget-feed-type == 'NUGET'
      uses: ./.github/actions/nuget-trusted-publish
      with:
        nuget-feed: "${{inputs.nuget-feed}}"
        nuget-username: "${{inputs.nuget-username}}"

    - name: "Dotnet: Publish Packages using sleet"
      if: inputs.nuget-feed-type == 'SLEET'
      uses: ./.github/actions/sleet
      with:
        sleet-config: "${{inputs.sleet-config}}"
        sleet-feed: "${{inputs.sleet-feed}}"
