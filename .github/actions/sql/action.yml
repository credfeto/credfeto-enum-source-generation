--- # Build SQL
# Maintain in repo: funfair-server-template
name: 'Build SQL'
description: 'Builds SQL Package'
inputs:
  db-folder:
    description: 'Folder where SQL Files live'
    required: true

  # GITHUB
  github-token:
    description: 'Github Token'
    required: true

runs:
  using: "composite"
  steps:
    - name: "SQL: Install TSQLLint"
      uses: ./.github/actions/dotnet-tool
      with:
        tool-name: "TSQLLint"
        tool-version: "latest"

    - name: "SQL: Lint SQL Files (TSQLLint)"
      uses: ./.github/actions/dotnet-tool-run
      with:
        tool-name: "tsqllint"
        tool-arguments: "${{inputs.db-folder}}"
        working-directory: ${{github.workspace}}

    - name: "SQL: Lint SQL Files (SQLFluff)"
      uses: super-linter/super-linter@4ce20838b8ab83717e78138c5b3a1407148e0918 # v8.7.0
      env:
        GITHUB_TOKEN: ${{inputs.github-token}}
        ENABLE_GITHUB_PULL_REQUEST_SUMMARY_COMMENT: false
        ENABLE_GITHUB_ACTIONS_STEP_SUMMARY: false
        SAVE_SUPER_LINTER_SUMMARY: false
        MULTI_STATUS: false
        VALIDATE_SQLFLUFF: true
        SQLFLUFF_CONFIG_FILE: .sqlfluff
