--- # Run dotnet tool
# Maintain in repo: funfair-server-template
name: "Run dotnet tool"
description: "Run dotnet tool"
inputs:
  working-directory:
    description: "Working directory"
    required: true
  tool-name:
    description: "Tool to run"
    required: true
  tool-arguments:
    description: >-
      Tool arguments, one argument per line (an option and its value are separate lines).
      Each line is passed literally as one argument, with no shell quoting, expansion or trimming.
      An empty line becomes an empty-string argument; a single trailing newline is ignored.
      A value containing a newline is split into several arguments.
    required: false
  untrusted-output:
    description: >-
      Whether the tool prints text controlled by the pull request, such as CHANGELOG.md lines;
      when 'true' its output cannot issue workflow commands.
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - name: "Run dotnet tool (Latest)"
      shell: bash
      working-directory: "${{inputs.working-directory}}"
      run: |
        TOOL_ARGS=()
        TOOL_ARGUMENTS_TEXT="${TOOL_ARGUMENTS%$'\n'}"
        if [ -n "$TOOL_ARGUMENTS_TEXT" ]; then
          mapfile -t TOOL_ARGS <<< "$TOOL_ARGUMENTS_TEXT"
        fi
        EXIT_CODE=0
        if [ "$UNTRUSTED_OUTPUT" = "true" ]; then
          # Untrusted tool output is printed between stop-commands markers so it cannot issue workflow commands;
          # the action's own annotations come after the closing marker.
          STOP_TOKEN=$(head -c 32 /dev/urandom | base64 -w0 | tr -dc 'A-Za-z0-9')
          echo "::stop-commands::$STOP_TOKEN"
          timeout 10m dotnet tool run --allow-roll-forward "$TOOL_NAME" "${TOOL_ARGS[@]}" || EXIT_CODE=$?
          # Leading newline so the closing marker starts its own line even if the output lacks a final newline.
          printf '\n::%s::\n' "$STOP_TOKEN"
        else
          timeout 10m dotnet tool run --allow-roll-forward "$TOOL_NAME" "${TOOL_ARGS[@]}" || EXIT_CODE=$?
        fi
        if [ "$EXIT_CODE" -eq 124 ]; then
          echo "::error::❌ ${TOOL_NAME//[$'\r\n']/ } timed out after 10 minutes"
        fi
        exit "$EXIT_CODE"
      env:
        TMP: "${{runner.temp}}"
        TOOL_NAME: "${{inputs.tool-name}}"
        TOOL_ARGUMENTS: "${{inputs.tool-arguments}}"
        UNTRUSTED_OUTPUT: "${{inputs.untrusted-output}}"
