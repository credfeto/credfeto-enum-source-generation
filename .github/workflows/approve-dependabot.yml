--- # Dependabot: approve dependency updates
# Maintain in repo: funfair-server-template
name: "Dependabot: Approve updates"
on:
  # https://securitylab.github.com/research/github-actions-preventing-pwn-requests
  # pull_request_target is required here so the job can read the SOURCE_PUSH_TOKEN secret, which has
  # write access and is used to approve and auto-merge Dependabot PRs; pull_request runs triggered by
  # Dependabot cannot read Actions secrets. GITHUB_TOKEN itself stays at contents: read.
  # NOTE: this job deliberately has no actions/checkout step, so no repository code is present in
  # the workspace. That keeps pull request code out of a job that holds the SOURCE_PUSH_TOKEN
  # secret, but it also means local uses: ./.github/actions/... references have nothing to load,
  # so any logic that would otherwise live in a local composite action is inlined here instead.
  pull_request_target:
    types:
      - opened
      - edited
      - reopened
      - synchronize
      - ready_for_review
    branches:
      - main

permissions:
  contents: read


jobs:
  approve-dependabot:
    # github.actor alone is not enough: an event Dependabot causes in a fork can make it the actor on a
    # fork PR, and this job must never approve or auto-merge a fork PR, so the PR head must also be in
    # this repository. A PR whose head repository was deleted has a null head.repo, so the comparison
    # is false and the job is skipped.
    if: |-
      vars.DEPENDABOT_AUTOMERGE == 'true'
      && github.actor == 'dependabot[bot]'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: >-
      ${{startsWith(vars.MAINTENANCE_ENVIRONMENT, '[')
      && fromJSON(vars.MAINTENANCE_ENVIRONMENT)
      || vars.MAINTENANCE_ENVIRONMENT
      || 'ubuntu-latest'}}
    steps:
      - name: "Check Required Secrets"
        shell: bash
        run: |
          if [ -z "$SOURCE_PUSH_TOKEN" ]; then
            echo "::error::SOURCE_PUSH_TOKEN is required but not set"
            exit 1
          fi
        env:
          SOURCE_PUSH_TOKEN: "${{secrets.SOURCE_PUSH_TOKEN}}"

      - name: "Auto Merge"
        if: startsWith(github.head_ref, 'dependabot/github_actions/') || startsWith(github.head_ref, 'dependabot/npm_and_yarn/')
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          MERGE_METHOD: "MERGE"
        with:
          github-token: "${{secrets.SOURCE_PUSH_TOKEN}}"
          script: |
            const mergeMethod = process.env.MERGE_METHOD;
            const nodeId = context.payload.pull_request.node_id;
            await github.graphql(`
              mutation EnableAutoMerge($pullRequestId: ID!, $mergeMethod: PullRequestMergeMethod!) {
                enablePullRequestAutoMerge(input: {
                  pullRequestId: $pullRequestId,
                  mergeMethod: $mergeMethod
                }) {
                  pullRequest {
                    autoMergeRequest {
                      mergeMethod
                    }
                  }
                }
              }
            `, {
              pullRequestId: nodeId,
              mergeMethod: mergeMethod,
            });
            core.info(`✅ Enabled auto-merge (${mergeMethod}) on PR #${context.payload.pull_request.number}`);
            core.notice(`Enabled auto-merge (${mergeMethod}) on PR #${context.payload.pull_request.number}`);

      - name: "Approve"
        if: startsWith(github.head_ref, 'dependabot/github_actions/') || startsWith(github.head_ref, 'dependabot/npm_and_yarn/')
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: "${{secrets.SOURCE_PUSH_TOKEN}}"
          script: |
            await github.rest.pulls.createReview({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              event: 'APPROVE',
            });
            core.info(`✅ Approved PR #${context.payload.pull_request.number}`);
            core.notice(`Approved PR #${context.payload.pull_request.number}`);
