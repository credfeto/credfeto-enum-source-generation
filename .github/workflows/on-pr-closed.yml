--- # Cleanup on PR Close
# Maintain in repo: funfair-server-template
name: "PR: Closed"
on:
  pull_request:
    types:
      - closed

permissions:
  contents: read

jobs:
  # A pull request from a fork is never passed a secret and gets a read-only token, so it cannot delete
  # caches, and it should not run on self-hosted runners: the job skips it and its caches are left to expire.
  # The skip is best effort, not an enforced boundary: a pull_request run uses the workflow files
  # from the pull request's merge ref, so a fork can edit it. The enforced controls are the
  # repository or organisation settings that require approval for fork pull request workflows and
  # that stop self-hosted runner groups being used by public repositories or fork pull requests.
  cleanup-cache:
    if: |-
      !(github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name != github.repository)
    runs-on: >-
      ${{startsWith(vars.MAINTENANCE_ENVIRONMENT, '[')
      && fromJSON(vars.MAINTENANCE_ENVIRONMENT)
      || vars.MAINTENANCE_ENVIRONMENT
      || 'ubuntu-latest'}}

    steps:
      - name: "Check Required Secrets"
        shell: bash
        run: |
          if [ -z "$SOURCE_PUSH_TOKEN" ]; then
            echo "::error::SOURCE_PUSH_TOKEN is required but not set"
            exit 1
          fi
        env:
          SOURCE_PUSH_TOKEN: "${{secrets.SOURCE_PUSH_TOKEN}}"

      - name: "Initialise Workspace"
        if: runner.environment == 'self-hosted'
        shell: bash
        run: sudo chown -R "$USER:$USER" "$GITHUB_WORKSPACE"

      - name: "Set Active Environment"
        shell: bash
        run: |
          {
            echo "ACTIVE_RUNNER_NAME=$RUNNER_NAME"
            echo "ACTIVE_HOSTNAME=$HOSTNAME"
            echo "ACTIVE_USER=$USER"
          } >> "$GITHUB_ENV"

      - name: "Cleanup"
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          BRANCH: "refs/pull/${{github.event.pull_request.number}}/merge"
        with:
          github-token: "${{secrets.SOURCE_PUSH_TOKEN}}"
          script: |
            const ref = process.env.BRANCH;
            const caches = await github.paginate(github.rest.actions.getActionsCacheList, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: ref,
            });
            core.info(`Found ${caches.length} cache(s) for ${ref}`);
            core.info('Deleting caches...');
            for (const cache of caches) {
              core.info(`Deleting cache: ${cache.key.replace(/[\r\n]/g, ' ')} (id: ${cache.id})`);
              try {
                await github.rest.actions.deleteActionsCacheById({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  cache_id: cache.id,
                });
              } catch (err) {
                core.warning(`Failed to delete cache ${cache.key}: ${err.message}`);
              }
            }
            core.info('Done');
